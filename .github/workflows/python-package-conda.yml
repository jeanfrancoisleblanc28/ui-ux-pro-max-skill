name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Fail the build only on syntax errors and undefined names.
          flake8 src/ui-ux-pro-max/scripts tests \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style warnings are non-fatal — the GitHub editor is 127 chars wide.
          flake8 src/ui-ux-pro-max/scripts tests \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          # Engine smoke tests + CSV knowledge-base structural validation.
          pytest tests/ -q
